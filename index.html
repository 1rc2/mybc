<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 令牌管理</title>
<style>
  /* ===== 全局重置 + 深色主题 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  /* ===== 登录页 ===== */
  .login-wrap {
    width: 360px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 32px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .login-wrap h1 {
    font-size: 20px;
    margin-bottom: 6px;
    color: #4e9acd;
  }
  .login-wrap .sub {
    font-size: 13px;
    color: #8b949e;
    margin-bottom: 24px;
  }
  .login-wrap label {
    display: block;
    font-size: 13px;
    color: #8b949e;
    margin: 10px 0 6px;
  }
  .login-wrap input {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .login-wrap input:focus { border-color: #4e9acd; }
  .login-wrap button {
    width: 100%;
    height: 40px;
    margin-top: 18px;
    background: #4e9acd;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background .15s;
  }
  .login-wrap button:hover { background: #3d8ab9; }
  .login-wrap button:disabled { background: #3a3f4a; cursor: not-allowed; }
  .err-msg {
    color: #f97583;
    font-size: 13px;
    margin-top: 10px;
    min-height: 18px;
  }

  /* ===== 主页面 ===== */
  .main-wrap {
    width: 100%;
    max-width: 560px;
    padding: 20px;
  }
  .main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .main-header h1 {
    font-size: 18px;
    color: #4e9acd;
  }
  .main-header button {
    height: 32px;
    padding: 0 14px;
    background: transparent;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    font-size: 13px;
    cursor: pointer;
  }
  .main-header button:hover { border-color: #4e9acd; color: #4e9acd; }

  /* ===== 令牌更新卡片 ===== */
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 28px;
  }
  .card h2 {
    font-size: 18px;
    color: #4e9acd;
    margin-bottom: 8px;
  }
  .card .hint {
    font-size: 13px;
    color: #8b949e;
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .card label {
    display: block;
    font-size: 13px;
    color: #8b949e;
    margin: 14px 0 6px;
  }
  .card .input-row {
    display: flex;
    gap: 10px;
  }
  .card input {
    flex: 1;
    height: 42px;
    padding: 0 12px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 14px;
    outline: none;
    font-family: "Menlo", "Consolas", monospace;
    transition: border-color .15s;
  }
  .card input:focus { border-color: #4e9acd; }
  .btn-toggle {
    width: 60px;
    height: 42px;
    background: transparent;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #8b949e;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-toggle:hover { border-color: #4e9acd; color: #4e9acd; }
  .btn-submit {
    width: 100%;
    height: 42px;
    margin-top: 14px;
    background: #4e9acd;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .btn-submit:hover { background: #3d8ab9; }
  .btn-submit:disabled { background: #3a3f4a; cursor: not-allowed; }

  /* ===== 结果提示 ===== */
  .result {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }
  .result.success {
    display: block;
    background: rgba(63, 185, 80, 0.12);
    border: 1px solid #2ea043;
    color: #3fb950;
  }
  .result.error {
    display: block;
    background: rgba(248, 81, 73, 0.12);
    border: 1px solid #f85149;
    color: #ff7b72;
  }
  .result.warn {
    display: block;
    background: rgba(210, 153, 34, 0.12);
    border: 1px solid #d29922;
    color: #e3b341;
  }

  /* ===== 滚动条 ===== */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0d1117; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #4e9acd; }
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div class="login-wrap" id="loginPage">
  <h1>GitHub 令牌管理</h1>
  <p class="sub">登录后管理你的 GitHub 个人访问令牌</p>
  <label for="username">账号</label>
  <input id="username" type="text" autocomplete="username" placeholder="请输入账号">
  <label for="password">密码</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
  <button id="loginBtn" onclick="doLogin()">登录</button>
  <div class="err-msg" id="loginErr"></div>
</div>

<!-- ===== 主页面（登录后显示） ===== -->
<div class="main-wrap" id="mainPage" style="display:none">
  <div class="main-header">
    <h1>GitHub 令牌管理</h1>
    <button onclick="doLogout()">退出登录</button>
  </div>
  <div class="card">
    <h2>更新 GitHub 个人访问令牌</h2>
    <p class="hint">输入新的 GitHub PAT（Personal Access Token），提交后立即生效。若已配置 Cloudflare API 凭证，令牌将持久化写入 Worker 环境变量，重启后仍有效。</p>
    <label for="patInput">新的 GitHub 令牌</label>
    <div class="input-row">
      <input id="patInput" type="password" autocomplete="off" placeholder="ghp_xxxxxxxxxxxx 或 github_pat_xxxxxxxxxxxx">
      <button class="btn-toggle" onclick="toggleVisibility()" id="toggleBtn">显示</button>
    </div>
    <button class="btn-submit" id="updateBtn" onclick="updatePat()">提交更新</button>
    <div class="result" id="result"></div>
  </div>
</div>

<script>
/* ============================================================
 * 前端逻辑说明
 * ------------------------------------------------------------
 * 1) 前端只保存临时登录 token（localStorage），不保存任何 API 密钥
 * 2) 提交新 PAT 时，附带 Authorization: Bearer <token>
 * 3) Worker 在后台用 CF_API_TOKEN 调用 Cloudflare API 更新环境变量
 * ============================================================ */

// ===== 配置：Cloudflare Worker 部署地址 =====
const WORKER_URL = "https://traemy.fuyi.workers.dev";

// token 管理（localStorage 只存登录凭证，不存密钥）
function getToken() { return localStorage.getItem("github_pat_token") || ""; }
function setToken(t) { localStorage.setItem("github_pat_token", t); }
function clearToken() { localStorage.removeItem("github_pat_token"); }

// 启动时检查登录状态
if (getToken()) { showMain(); } else { showLogin(); }

function showLogin() {
  document.getElementById("loginPage").style.display = "";
  document.getElementById("mainPage").style.display = "none";
}
function showMain() {
  document.getElementById("loginPage").style.display = "none";
  document.getElementById("mainPage").style.display = "";
  document.getElementById("patInput").focus();
}

// ===== 登录 =====
async function doLogin() {
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value;
  const errEl = document.getElementById("loginErr");
  const btn = document.getElementById("loginBtn");
  errEl.textContent = "";
  if (!u || !p) { errEl.textContent = "请输入账号和密码"; return; }
  btn.disabled = true; btn.textContent = "登录中...";
  try {
    const res = await fetch(`${WORKER_URL}/api/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (res.ok && data.token) {
      setToken(data.token);
      showMain();
    } else {
      errEl.textContent = data.error || "登录失败";
    }
  } catch (e) {
    errEl.textContent = "网络错误：" + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "登录";
  }
}

// ===== 退出登录 =====
function doLogout() {
  clearToken();
  showLogin();
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("patInput").value = "";
  const result = document.getElementById("result");
  result.className = "result";
  result.textContent = "";
}

// ===== 更新 GitHub PAT =====
async function updatePat() {
  const input = document.getElementById("patInput");
  const btn = document.getElementById("updateBtn");
  const result = document.getElementById("result");
  const newPat = input.value.trim();
  result.className = "result";
  result.textContent = "";
  if (!newPat) {
    showResult("error", "请输入新的 GitHub 令牌");
    return;
  }
  if (!getToken()) { clearToken(); showLogin(); return; }

  btn.disabled = true;
  btn.textContent = "提交中...";
  try {
    const res = await fetch(`${WORKER_URL}/api/update-key`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + getToken()  // 只传临时 token，不传 API 密钥
      },
      body: JSON.stringify({ apiKey: newPat })  // 字段名 apiKey，与后端一致
    });
    const data = await res.json();
    if (res.status === 401) {
      clearToken();
      showResult("error", "登录已失效，请重新登录");
      setTimeout(showLogin, 1500);
    } else if (res.ok) {
      if (data.persisted) {
        showResult("success", data.message || "令牌更新成功，已持久化到环境变量");
      } else {
        showResult("warn", data.message || "令牌已在内存中生效，但未持久化");
      }
      input.value = "";  // 提交后清空输入框
    } else {
      showResult("error", data.error || "更新失败");
    }
  } catch (e) {
    showResult("error", "网络错误：" + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "提交更新";
  }
}

// ===== 显示/隐藏令牌 =====
function toggleVisibility() {
  const input = document.getElementById("patInput");
  const btn = document.getElementById("toggleBtn");
  if (input.type === "password") {
    input.type = "text";
    btn.textContent = "隐藏";
  } else {
    input.type = "password";
    btn.textContent = "显示";
  }
}

// ===== 显示结果提示 =====
function showResult(type, text) {
  const el = document.getElementById("result");
  el.className = "result " + type;
  el.textContent = text;
}
</script>
</body>
</html>
