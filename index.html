<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 令牌管理</title>
<style>
  /* ===== 全局重置 + 深色主题 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  /* ===== 登录页 ===== */
  .login-wrap {
    width: 360px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 32px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .login-wrap h1 {
    font-size: 20px;
    margin-bottom: 6px;
    color: #4e9acd;
  }
  .login-wrap .sub {
    font-size: 13px;
    color: #8b949e;
    margin-bottom: 24px;
  }
  .login-wrap label {
    display: block;
    font-size: 13px;
    color: #8b949e;
    margin: 10px 0 6px;
  }
  .login-wrap input {
    width: 100%;
    height: 40px;
    padding: 0 40px 0 12px; /* 右侧留出眼睛按钮空间 */
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .login-wrap input:focus { border-color: #4e9acd; }

  /* 密码行容器：相对定位，让眼睛按钮绝对定位叠在输入框内部右侧 */
  .pwd-row {
    position: relative;
  }
  .pwd-row input {
    padding-right: 40px;
  }
  .eye-btn {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    background: transparent;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }
  .eye-btn:hover { background: rgba(78,154,205,0.12); }
  .eye-btn:active { background: rgba(78,154,205,0.2); }
  .eye-btn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: #8b949e;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .eye-btn:hover svg { stroke: #4e9acd; }

  /* 登录按钮：只匹配直接子级的 #loginBtn，别误伤 .pwd-row 里的 .eye-btn */
  .login-wrap > button#loginBtn {
    width: 100%;
    height: 40px;
    margin-top: 18px;
    background: #4e9acd;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background .15s;
  }
  .login-wrap > button#loginBtn:hover { background: #3d8ab9; }
  .login-wrap > button#loginBtn:disabled { background: #3a3f4a; cursor: not-allowed; }
  .err-msg {
    color: #f97583;
    font-size: 13px;
    margin-top: 10px;
    min-height: 18px;
  }

  /* 登录页底部：接口地址 + 连接状态 */
  .login-footer {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed #30363d;
    font-size: 12px;
    color: #8b949e;
    line-height: 1.8;
    word-break: break-all;
  }
  .login-footer .status-ok { color: #3fb950; }
  .login-footer .status-bad { color: #f97583; }
  .login-footer .status-wait { color: #8b949e; }

  /* ===== 主页面 ===== */
  .main-wrap {
    width: 100%;
    max-width: 560px;
    padding: 20px;
  }
  .main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .main-header h1 {
    font-size: 18px;
    color: #4e9acd;
  }
  .main-header button {
    height: 32px;
    padding: 0 14px;
    background: transparent;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    font-size: 13px;
    cursor: pointer;
  }
  .main-header button:hover { border-color: #4e9acd; color: #4e9acd; }

  /* ===== 令牌更新卡片 ===== */
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 28px;
  }
  .card h2 {
    font-size: 18px;
    color: #4e9acd;
    margin-bottom: 8px;
  }
  .card .hint {
    font-size: 13px;
    color: #8b949e;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  /* ===== 当前令牌状态 ===== */
  .current-token {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .current-token .label {
    font-size: 12px;
    color: #8b949e;
    margin-bottom: 4px;
  }
  .current-token .value {
    font-size: 14px;
    color: #e6edf3;
    font-family: "Menlo", "Consolas", monospace;
    word-break: break-all;
  }
  .current-token .value.empty { color: #f85149; }
  .current-token .refresh-btn {
    flex-shrink: 0;
    height: 30px;
    padding: 0 12px;
    background: transparent;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #8b949e;
    font-size: 12px;
    cursor: pointer;
  }
  .current-token .refresh-btn:hover { border-color: #4e9acd; color: #4e9acd; }
  .current-token .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .card label {
    display: block;
    font-size: 13px;
    color: #8b949e;
    margin: 14px 0 6px;
  }
  .card .input-row {
    display: flex;
    gap: 10px;
  }
  .card input {
    flex: 1;
    height: 42px;
    padding: 0 12px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 14px;
    outline: none;
    font-family: "Menlo", "Consolas", monospace;
    transition: border-color .15s;
  }
  .card input:focus { border-color: #4e9acd; }
  .btn-toggle {
    width: 60px;
    height: 42px;
    background: transparent;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #8b949e;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-toggle:hover { border-color: #4e9acd; color: #4e9acd; }
  .btn-submit {
    width: 100%;
    height: 42px;
    margin-top: 14px;
    background: #4e9acd;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .btn-submit:hover { background: #3d8ab9; }
  .btn-submit:disabled { background: #3a3f4a; cursor: not-allowed; }

  /* ===== 结果提示 ===== */
  .result {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }
  .result.success {
    display: block;
    background: rgba(63, 185, 80, 0.12);
    border: 1px solid #2ea043;
    color: #3fb950;
  }
  .result.error {
    display: block;
    background: rgba(248, 81, 73, 0.12);
    border: 1px solid #f85149;
    color: #ff7b72;
  }
  .result.warn {
    display: block;
    background: rgba(210, 153, 34, 0.12);
    border: 1px solid #d29922;
    color: #e3b341;
  }

  /* ===== 滚动条 ===== */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0d1117; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #4e9acd; }
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div class="login-wrap" id="loginPage">
  <h1>GitHub 令牌管理</h1>
  <p class="sub">登录后管理你的 GitHub 个人访问令牌</p>
  <label for="username">账号</label>
  <input id="username" type="text" autocomplete="username" placeholder="请输入账号">
  <label for="password">密码</label>
  <div class="pwd-row">
    <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
    <button type="button" class="eye-btn" onclick="toggleLoginPwd()" id="loginEye" title="显示/隐藏密码">
      <svg id="eyeOpen" viewBox="0 0 24 24">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <svg id="eyeClose" viewBox="0 0 24 24" style="display:none">
        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.77 19.77 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.6 19.6 0 0 1-3.17 4.19M1 1l22 22"/>
        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
      </svg>
    </button>
  </div>
  <button id="loginBtn" onclick="doLogin()">登录</button>
  <div class="err-msg" id="loginErr"></div>

  <!-- 底部：接口地址 + 连接状态（方便排错 Failed to fetch） -->
  <div class="login-footer">
    <div>接口：<span id="workerUrlDisplay">-</span></div>
    <div>连接：<span id="workerStatus" class="status-wait">检测中...</span></div>
  </div>
</div>

<!-- ===== 主页面（登录后显示） ===== -->
<div class="main-wrap" id="mainPage" style="display:none">
  <div class="main-header">
    <h1>GitHub 令牌管理</h1>
    <button onclick="doLogout()">退出登录</button>
  </div>
  <div class="card">
    <h2>更新 GitHub 个人访问令牌</h2>
    <p class="hint">输入新的 GitHub PAT（Personal Access Token），提交后立即生效。若已配置 Cloudflare API 凭证，令牌将持久化写入 Worker 环境变量，重启后仍有效。</p>

    <!-- 当前令牌状态（脱敏预览，从后端 /api/get-token 获取） -->
    <div class="current-token">
      <div>
        <div class="label">当前令牌</div>
        <div class="value empty" id="currentToken">加载中...</div>
      </div>
      <button class="refresh-btn" id="refreshBtn" onclick="loadCurrentToken()">刷新</button>
    </div>

    <label for="patInput">新的 GitHub 令牌</label>
    <div class="input-row">
      <input id="patInput" type="password" autocomplete="off" placeholder="ghp_xxxxxxxxxxxx 或 github_pat_xxxxxxxxxxxx">
      <button class="btn-toggle" onclick="toggleVisibility()" id="toggleBtn">显示</button>
    </div>
    <button class="btn-submit" id="updateBtn" onclick="updatePat()">提交更新</button>
    <div class="result" id="result"></div>
  </div>
</div>

<script>
/* ============================================================
 * 前端逻辑说明
 * ------------------------------------------------------------
 * 1) 前端只保存临时登录 token（localStorage），不保存任何 API 密钥
 * 2) 提交新 PAT 时，附带 Authorization: Bearer <token>
 * 3) Worker 在后台用 CF_API_TOKEN 调用 Cloudflare API 更新环境变量
 * ============================================================ */

// ===== API 基地址自动判断 =====
// 同一套前端部署在两处：
//   1) Cloudflare Worker（traemy.fuyi.workers.dev）—— 前后端同源，用相对路径即可
//   2) GitHub Pages（1rc2.github.io/mybc/）—— 只有静态前端，必须跨域调 Worker 后端
// 根据当前 hostname 自动决定用哪种模式，Worker 端已配置 CORS 反射 Origin
const API_BASE = location.hostname.endsWith(".workers.dev")
  ? ""
  : "https://traemy.fuyi.workers.dev";

// ===== 通用带超时+重试的 fetch 包装 =====
// Cloudflare Workers 在部分网络下偶发不稳定，加一层保护：
//   - 单次请求超时 10 秒
//   - 网络层失败时自动重试 2 次（总共 3 次尝试，间隔 1s/2s 指数退避）
//   - 错误分类：timeout / network / http / cors，让 UI 能给出精准诊断
async function apiFetch(path, options = {}) {
  const MAX_ATTEMPTS = 3;
  const TIMEOUT_MS = 10000;

  let lastError = null;
  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

    try {
      const res = await fetch(API_BASE + path, {
        ...options,
        signal: controller.signal,
      });
      clearTimeout(timer);

      // 有响应但 HTTP 错误
      let data = null;
      try { data = await res.json(); } catch { /* 非 JSON 忽略 */ }
      return { ok: res.ok, status: res.status, data, error: null };
    } catch (e) {
      clearTimeout(timer);

      // 错误分类
      let category = "network";
      let message = "";
      if (e.name === "AbortError") {
        category = "timeout";
        message = `请求超时（${TIMEOUT_MS / 1000}秒），后端未响应`;
      } else if (e.message && /Failed to fetch/i.test(e.message)) {
        category = "cors_or_network";
        message = "连接被阻断（可能是网络限制，workers.dev 在部分地区不稳定）";
      } else if (e.message && /NetworkError|network/i.test(e.message)) {
        category = "network";
        message = "网络层错误（DNS 解析失败或连接被关闭）";
      } else {
        category = "unknown";
        message = e.message || String(e);
      }

      lastError = { category, message };

      // 最后一次尝试也失败 → 返回
      if (attempt === MAX_ATTEMPTS) break;

      // 等一下再重试（指数退避：1s, 2s）
      const backoff = Math.pow(2, attempt - 1) * 1000;
      await new Promise(r => setTimeout(r, backoff));
    }
  }
  return { ok: false, status: 0, data: null, error: lastError };
}

// token 管理（localStorage 只存登录凭证，不存密钥）
function getToken() { return localStorage.getItem("github_pat_token") || ""; }
function setToken(t) { localStorage.setItem("github_pat_token", t); }
function clearToken() { localStorage.removeItem("github_pat_token"); }

// 启动时检查登录状态 + 检测 Worker 连接
if (getToken()) { showMain(); } else { showLogin(); checkWorkerHealth(); }

function showLogin() {
  document.getElementById("loginPage").style.display = "";
  document.getElementById("mainPage").style.display = "none";
}
function showMain() {
  document.getElementById("loginPage").style.display = "none";
  document.getElementById("mainPage").style.display = "";
  document.getElementById("patInput").focus();
  loadCurrentToken();  // 进入主页时加载当前令牌状态
}

// ===== 加载当前令牌（脱敏预览，调用后端 GET /api/get-token） =====
async function loadCurrentToken() {
  const el = document.getElementById("currentToken");
  const btn = document.getElementById("refreshBtn");
  if (!getToken()) { clearToken(); showLogin(); return; }
  el.className = "value empty";
  el.textContent = "加载中...";
  btn.disabled = true;
  const res = await apiFetch("/api/get-token", {
    method: "GET",
    headers: { "Authorization": "Bearer " + getToken() }
  });
  if (res.error) {
    // 网络层失败（超时/DNS/workers.dev 被阻挡）
    el.className = "value empty";
    el.textContent = "⚠️ " + res.error.message;
  } else if (res.status === 401) {
    clearToken();
    el.textContent = "登录已失效";
    setTimeout(showLogin, 1500);
  } else if (res.ok) {
    if (res.data && res.data.hasToken && res.data.preview) {
      el.className = "value";
      el.textContent = res.data.preview;
    } else {
      el.className = "value empty";
      el.textContent = "（未设置）";
    }
  } else {
    el.className = "value empty";
    el.textContent = res.data && res.data.error || ("加载失败（HTTP " + res.status + "）");
  }
  btn.disabled = false;
}

// ===== 登录 =====
async function doLogin() {
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value;
  const errEl = document.getElementById("loginErr");
  const btn = document.getElementById("loginBtn");
  errEl.textContent = "";
  if (!u || !p) { errEl.textContent = "请输入账号和密码"; return; }
  btn.disabled = true; btn.textContent = "登录中...";
  const res = await apiFetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: u, password: p })
  });
  if (res.error) {
    errEl.textContent = "⚠️ 无法连接后端（" + res.error.message + "）";
  } else if (res.ok && res.data.token) {
    setToken(res.data.token);
    showMain();
  } else {
    errEl.textContent = res.data && res.data.error || "登录失败";
  }
  btn.disabled = false; btn.textContent = "登录";
}

// ===== 退出登录 =====
function doLogout() {
  clearToken();
  showLogin();
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("patInput").value = "";
  const result = document.getElementById("result");
  result.className = "result";
  result.textContent = "";
}

// ===== 更新 GitHub PAT =====
async function updatePat() {
  const input = document.getElementById("patInput");
  const btn = document.getElementById("updateBtn");
  const result = document.getElementById("result");
  const newPat = input.value.trim();
  result.className = "result";
  result.textContent = "";
  if (!newPat) {
    showResult("error", "请输入新的 GitHub 令牌");
    return;
  }
  if (!getToken()) { clearToken(); showLogin(); return; }

  btn.disabled = true;
  btn.textContent = "提交中...";
  const res = await apiFetch("/api/update-key", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + getToken()
    },
    body: JSON.stringify({ apiKey: newPat })
  });
  if (res.error) {
    showResult("error", "⚠️ 无法连接后端（" + res.error.message + "）");
  } else if (res.status === 401) {
    clearToken();
    showResult("error", "登录已失效，请重新登录");
    setTimeout(showLogin, 1500);
  } else if (res.ok) {
    if (res.data && res.data.persisted) {
      showResult("success", res.data.message || "令牌更新成功，已持久化到环境变量");
    } else {
      showResult("warn", res.data.message || "令牌已在内存中生效，但未持久化");
    }
    input.value = "";
    loadCurrentToken();
  } else {
    showResult("error", res.data && res.data.error || "更新失败");
  }
  btn.disabled = false;
  btn.textContent = "提交更新";
}

// ===== 登录页密码框：小眼睛切换 =====
function toggleLoginPwd() {
  const input = document.getElementById("password");
  const eyeOpen = document.getElementById("eyeOpen");
  const eyeClose = document.getElementById("eyeClose");
  if (input.type === "password") {
    input.type = "text";
    eyeOpen.style.display = "none";
    eyeClose.style.display = "";
  } else {
    input.type = "password";
    eyeOpen.style.display = "";
    eyeClose.style.display = "none";
  }
}

// ===== 主页面令牌框：显示/隐藏 =====
function toggleVisibility() {
  const input = document.getElementById("patInput");
  const btn = document.getElementById("toggleBtn");
  if (input.type === "password") {
    input.type = "text";
    btn.textContent = "隐藏";
  } else {
    input.type = "password";
    btn.textContent = "显示";
  }
}

// ===== 登录页底部：Worker 连接状态检测 =====
async function checkWorkerHealth() {
  // 根据 API_BASE 显示真实后端地址和连接模式
  const urlEl = document.getElementById("workerUrlDisplay");
  const statusEl = document.getElementById("workerStatus");
  if (!urlEl || !statusEl) return;  // 主页面不显示
  if (API_BASE) {
    // 跨域模式：前端（Pages/其他）→ Worker 后端
    urlEl.textContent = API_BASE + "（跨域调用）";
  } else {
    // 同源模式：Worker 前端 → Worker 后端
    urlEl.textContent = location.origin + "（同源）";
  }
  statusEl.textContent = "检测中...";
  statusEl.className = "status-wait";
  const res = await apiFetch("/health", { method: "GET" });
  if (res.error) {
    // 网络层失败：精准显示分类诊断 + 重试次数
    const retries = 3;  // apiFetch 内部重试次数
    const catLabel = {
      "timeout": "请求超时",
      "cors_or_network": "网络阻断",
      "network": "网络错误",
      "unknown": "未知错误"
    }[res.error.category] || res.error.category;
    statusEl.textContent = `❌ ${catLabel}（已重试${retries}次）：${res.error.message}`;
    statusEl.className = "status-bad";
  } else if (res.ok) {
    statusEl.textContent = "✅ 已连接";
    statusEl.className = "status-ok";
  } else {
    statusEl.textContent = "❌ Worker 返回 HTTP " + res.status;
    statusEl.className = "status-bad";
  }
}
function shorten(s) { return s.length > 40 ? s.slice(0, 40) + "..." : (s || "未知错误"); }

// ===== 显示结果提示 =====
function showResult(type, text) {
  const el = document.getElementById("result");
