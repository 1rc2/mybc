<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 令牌管理</title>
<style>
  /* ===== 全局重置 + 深色主题 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  /* ===== 主页面 ===== */
  .main-wrap {
    width: 100%;
    max-width: 560px;
    padding: 20px;
  }
  .main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .main-header h1 {
    font-size: 18px;
    color: #4e9acd;
  }

  /* ===== 令牌更新卡片 ===== */
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 28px;
  }
  .card h2 {
    font-size: 18px;
    color: #4e9acd;
    margin-bottom: 8px;
  }
  .card .hint {
    font-size: 13px;
    color: #8b949e;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  /* ===== 当前令牌状态 ===== */
  .current-token {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .current-token .label {
    font-size: 12px;
    color: #8b949e;
    margin-bottom: 4px;
  }
  .current-token .value {
    font-size: 14px;
    color: #e6edf3;
    font-family: "Menlo", "Consolas", monospace;
    word-break: break-all;
  }
  .current-token .value.empty { color: #f85149; }
  .current-token .refresh-btn {
    flex-shrink: 0;
    height: 30px;
    padding: 0 12px;
    background: transparent;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #8b949e;
    font-size: 12px;
    cursor: pointer;
  }
  .current-token .refresh-btn:hover { border-color: #4e9acd; color: #4e9acd; }
  .current-token .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .card label {
    display: block;
    font-size: 13px;
    color: #8b949e;
    margin: 14px 0 6px;
  }
  .card .input-row {
    display: flex;
    gap: 10px;
  }
  .card input {
    flex: 1;
    height: 42px;
    padding: 0 12px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 14px;
    outline: none;
    font-family: "Menlo", "Consolas", monospace;
    transition: border-color .15s;
  }
  .card input:focus { border-color: #4e9acd; }
  .btn-toggle {
    width: 60px;
    height: 42px;
    background: transparent;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #8b949e;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-toggle:hover { border-color: #4e9acd; color: #4e9acd; }
  .btn-submit {
    width: 100%;
    height: 42px;
    margin-top: 14px;
    background: #4e9acd;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .btn-submit:hover { background: #3d8ab9; }
  .btn-submit:disabled { background: #3a3f4a; cursor: not-allowed; }

  /* ===== 结果提示 ===== */
  .result {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }
  .result.success {
    display: block;
    background: rgba(63, 185, 80, 0.12);
    border: 1px solid #2ea043;
    color: #3fb950;
  }
  .result.error {
    display: block;
    background: rgba(248, 81, 73, 0.12);
    border: 1px solid #f85149;
    color: #ff7b72;
  }
  .result.warn {
    display: block;
    background: rgba(210, 153, 34, 0.12);
    border: 1px solid #d29922;
    color: #e3b341;
  }

  /* ===== 滚动条 ===== */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0d1117; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #4e9acd; }
</style>
</head>
<body>

<!-- ===== 主页面（无登录，直接显示） ===== -->
<div class="main-wrap">
  <div class="main-header">
    <h1>GitHub 令牌管理</h1>
  </div>
  <div class="card">
    <h2>更新 GitHub 个人访问令牌</h2>
    <p class="hint">输入新的 GitHub PAT（Personal Access Token），提交后立即生效。若已配置 Cloudflare API 凭证，令牌将持久化写入 Worker 环境变量，重启后仍有效。</p>

    <!-- 当前令牌状态（脱敏预览，从后端 /api/get-token 获取） -->
    <div class="current-token">
      <div>
        <div class="label">当前令牌</div>
        <div class="value empty" id="currentToken">加载中...</div>
      </div>
      <button class="refresh-btn" id="refreshBtn" onclick="loadCurrentToken()">刷新</button>
    </div>

    <label for="patInput">新的 GitHub 令牌</label>
    <div class="input-row">
      <input id="patInput" type="password" autocomplete="off" placeholder="ghp_xxxxxxxxxxxx 或 github_pat_xxxxxxxxxxxx">
      <button class="btn-toggle" onclick="toggleVisibility()" id="toggleBtn">显示</button>
    </div>
    <button class="btn-submit" id="updateBtn" onclick="updatePat()">提交更新</button>
    <div class="result" id="result"></div>
  </div>
</div>

<script>
/* ============================================================
 * 前端逻辑说明
 * ------------------------------------------------------------
 * 前端与后端同源部署在 Cloudflare Worker 上，
 * 直接调用相对路径 /api/update-key 和 /api/get-token，
 * 不需要任何登录认证。
 * ============================================================ */

// 页面加载完成后自动读取当前令牌
window.addEventListener("DOMContentLoaded", () => {
  loadCurrentToken();
  document.getElementById("patInput").focus();
});

// ===== 加载当前令牌（脱敏预览） =====
async function loadCurrentToken() {
  const el = document.getElementById("currentToken");
  const btn = document.getElementById("refreshBtn");
  el.className = "value empty";
  el.textContent = "加载中...";
  btn.disabled = true;
  try {
    const res = await fetch("/api/get-token", { method: "GET" });
    const data = await res.json();
    if (res.ok) {
      if (data.hasToken && data.preview) {
        el.className = "value";
        el.textContent = data.preview;
      } else {
        el.className = "value empty";
        el.textContent = "（未设置）";
      }
    } else {
      el.className = "value empty";
      el.textContent = data.error || "加载失败";
    }
  } catch (e) {
    el.className = "value empty";
    el.textContent = "网络错误：" + e.message;
  } finally {
    btn.disabled = false;
  }
}

// ===== 更新 GitHub PAT =====
async function updatePat() {
  const input = document.getElementById("patInput");
  const btn = document.getElementById("updateBtn");
  const newPat = input.value.trim();
  const result = document.getElementById("result");
  result.className = "result";
  result.textContent = "";
  if (!newPat) {
    showResult("error", "请输入新的 GitHub 令牌");
    return;
  }

  btn.disabled = true;
  btn.textContent = "提交中...";
  try {
    const res = await fetch("/api/update-key", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ apiKey: newPat })
    });
    const data = await res.json();
    if (res.ok) {
      if (data.persisted) {
        showResult("success", data.message || "令牌更新成功，已持久化到环境变量");
      } else {
        showResult("warn", data.message || "令牌已在内存中生效，但未持久化");
      }
      input.value = "";
      loadCurrentToken();
    } else {
      showResult("error", data.error || "更新失败");
    }
  } catch (e) {
    showResult("error", "网络错误：" + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "提交更新";
  }
}

// ===== 令牌框：显示/隐藏切换 =====
function toggleVisibility() {
  const input = document.getElementById("patInput");
  const btn = document.getElementById("toggleBtn");
  if (input.type === "password") {
    input.type = "text";
    btn.textContent = "隐藏";
  } else {
    input.type = "password";
    btn.textContent = "显示";
  }
}

// ===== 显示结果提示 =====
function showResult(type, text) {
  const el = document.getElementById("result");
  el.className = "result " + type;
  el.textContent = text;
}
</script>
</body>
</html>
