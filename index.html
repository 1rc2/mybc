<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 令牌管理</title>
<style>
  /* ===== 全局重置 + 深色主题 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  /* ===== 登录页 ===== */
  .login-wrap {
    width: 360px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 32px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .login-wrap h1 {
    font-size: 20px;
    margin-bottom: 6px;
    color: #4e9acd;
  }
  .login-wrap .sub {
    font-size: 13px;
    color: #8b949e;
    margin-bottom: 24px;
  }
  .login-wrap label {
    display: block;
    font-size: 13px;
    color: #8b949e;
    margin: 10px 0 6px;
  }
  .login-wrap input {
    width: 100%;
    height: 40px;
    padding: 0 40px 0 12px; /* 右侧留出眼睛按钮空间 */
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .login-wrap input:focus { border-color: #4e9acd; }

  /* 密码行容器：相对定位，让眼睛按钮绝对定位叠在输入框内部右侧 */
  .pwd-row {
    position: relative;
  }
  .pwd-row input {
    padding-right: 40px;
  }
  .eye-btn {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    background: transparent;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }
  .eye-btn:hover { background: rgba(78,154,205,0.12); }
  .eye-btn:active { background: rgba(78,154,205,0.2); }
  .eye-btn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: #8b949e;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .eye-btn:hover svg { stroke: #4e9acd; }

  /* 登录按钮：只匹配直接子级的 #loginBtn，别误伤 .pwd-row 里的 .eye-btn */
  .login-wrap > button#loginBtn {
    width: 100%;
    height: 40px;
    margin-top: 18px;
    background: #4e9acd;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background .15s;
  }
  .login-wrap > button#loginBtn:hover { background: #3d8ab9; }
  .login-wrap > button#loginBtn:disabled { background: #3a3f4a; cursor: not-allowed; }
  .err-msg {
    color: #f97583;
    font-size: 13px;
    margin-top: 10px;
    min-height: 18px;
  }

  /* 登录页底部：接口地址 + 连接状态 */
  .login-footer {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed #30363d;
    font-size: 12px;
    color: #8b949e;
    line-height: 1.8;
    word-break: break-all;
  }
  .login-footer .status-ok { color: #3fb950; }
  .login-footer .status-bad { color: #f97583; }
  .login-footer .status-wait { color: #8b949e; }

  /* ===== 主页面 ===== */
  .main-wrap {
    width: 100%;
    max-width: 560px;
    padding: 20px;
  }
  .main-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .main-header h1 {
    font-size: 18px;
    color: #4e9acd;
  }
  .main-header button {
    height: 32px;
    padding: 0 14px;
    background: transparent;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    font-size: 13px;
    cursor: pointer;
  }
  .main-header button:hover { border-color: #4e9acd; color: #4e9acd; }

  /* ===== 令牌更新卡片 ===== */
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 28px;
  }
  .card h2 {
    font-size: 18px;
    color: #4e9acd;
    margin-bottom: 8px;
  }
  .card .hint {
    font-size: 13px;
    color: #8b949e;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  /* ===== 当前令牌状态 ===== */
  .current-token {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .current-token .label {
    font-size: 12px;
    color: #8b949e;
    margin-bottom: 4px;
  }
  .current-token .value {
    font-size: 14px;
    color: #e6edf3;
    font-family: "Menlo", "Consolas", monospace;
    word-break: break-all;
  }
  .current-token .value.empty { color: #f85149; }
  .current-token .refresh-btn {
    flex-shrink: 0;
    height: 30px;
    padding: 0 12px;
    background: transparent;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #8b949e;
    font-size: 12px;
    cursor: pointer;
  }
  .current-token .refresh-btn:hover { border-color: #4e9acd; color: #4e9acd; }
  .current-token .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .card label {
    display: block;
    font-size: 13px;
    color: #8b949e;
    margin: 14px 0 6px;
  }
  .card .input-row {
    display: flex;
    gap: 10px;
  }
  .card input {
    flex: 1;
    height: 42px;
    padding: 0 12px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 14px;
    outline: none;
    font-family: "Menlo", "Consolas", monospace;
    transition: border-color .15s;
  }
  .card input:focus { border-color: #4e9acd; }
  .btn-toggle {
    width: 60px;
    height: 42px;
    background: transparent;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #8b949e;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-toggle:hover { border-color: #4e9acd; color: #4e9acd; }
  .btn-submit {
    width: 100%;
    height: 42px;
    margin-top: 14px;
    background: #4e9acd;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  .btn-submit:hover { background: #3d8ab9; }
  .btn-submit:disabled { background: #3a3f4a; cursor: not-allowed; }

  /* ===== 结果提示 ===== */
  .result {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }
  .result.success {
    display: block;
    background: rgba(63, 185, 80, 0.12);
    border: 1px solid #2ea043;
    color: #3fb950;
  }
  .result.error {
    display: block;
    background: rgba(248, 81, 73, 0.12);
    border: 1px solid #f85149;
    color: #ff7b72;
  }
  .result.warn {
    display: block;
    background: rgba(210, 153, 34, 0.12);
    border: 1px solid #d29922;
    color: #e3b341;
  }

  /* ===== 滚动条 ===== */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0d1117; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #4e9acd; }
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div class="login-wrap" id="loginPage">
  <h1>GitHub 令牌管理</h1>
  <div id="modeLabel" style="font-size:12px;color:#4e9acd;margin:-4px 0 8px;"></div>
  <p class="sub">登录后管理你的 GitHub 个人访问令牌</p>
  <label for="username">账号</label>
  <input id="username" type="text" autocomplete="username" placeholder="请输入账号">
  <label for="password">密码</label>
  <div class="pwd-row">
    <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
    <button type="button" class="eye-btn" onclick="toggleLoginPwd()" id="loginEye" title="显示/隐藏密码">
      <svg id="eyeOpen" viewBox="0 0 24 24">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <svg id="eyeClose" viewBox="0 0 24 24" style="display:none">
        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.77 19.77 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.6 19.6 0 0 1-3.17 4.19M1 1l22 22"/>
        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
      </svg>
    </button>
  </div>
  <button id="loginBtn" onclick="doLogin()">登录</button>
  <div class="err-msg" id="loginErr"></div>

  <!-- 底部：接口地址 + 连接状态（方便排错 Failed to fetch） -->
  <div class="login-footer">
    <div>接口：<span id="workerUrlDisplay">-</span></div>
    <div>连接：<span id="workerStatus" class="status-wait">检测中...</span></div>
  </div>
</div>

<!-- ===== 主页面（登录后显示） ===== -->
<div class="main-wrap" id="mainPage" style="display:none">
  <div class="main-header">
    <h1>GitHub 令牌管理</h1>
    <button onclick="doLogout()">退出登录</button>
  </div>
  <div class="card">
    <h2>更新 GitHub 个人访问令牌</h2>
    <p class="hint">输入新的 GitHub PAT（Personal Access Token），提交后立即生效。若已配置 Cloudflare API 凭证，令牌将持久化写入 Worker 环境变量，重启后仍有效。</p>

    <!-- 当前令牌状态（脱敏预览，从后端 /api/get-token 获取） -->
    <div class="current-token">
      <div>
        <div class="label">当前令牌</div>
        <div class="value empty" id="currentToken">加载中...</div>
      </div>
      <button class="refresh-btn" id="refreshBtn" onclick="loadCurrentToken()">刷新</button>
    </div>

    <label for="patInput">新的 GitHub 令牌</label>
    <div class="input-row">
      <input id="patInput" type="password" autocomplete="off" placeholder="ghp_xxxxxxxxxxxx 或 github_pat_xxxxxxxxxxxx">
      <button class="btn-toggle" onclick="toggleVisibility()" id="toggleBtn">显示</button>
    </div>
    <button class="btn-submit" id="updateBtn" onclick="updatePat()">提交更新</button>
    <div class="result" id="result"></div>
  </div>
</div>

<script>/* ============================================================
 * 前端核心 JS —— 双模式（Worker / GitHub）自动切换
 * 安全设计：
 *   1) 主密码只在内存短暂存在（每次输入，localStorage 不存）
 *   2) 真实 PAT 用完立即覆盖 null（内存即清）
 *   3) GitHub Mode 下 Gist/Contents 文件存 AES-256-GCM 密文 blob
 *   4) PBKDF2-SHA256 派生密钥 100000 轮
 * ============================================================ */

// ===== 模式自动判断 =====
// *.workers.dev 域名 => Worker Mode（同源后端，密钥存 Cloudflare 环境变量）
// 其他域名 => GitHub Mode（Repository Contents + AES 加密，多设备同步）
const MODE = location.hostname.endsWith(".workers.dev") ? "worker" : "github";
const API_BASE = MODE === "worker" ? "" : "https://api.github.com";
const GITHUB_REPO = "1rc2/mybc";
const GITHUB_FILE = ".sync-data/token_store.json";
const PBKDF2_ITER = 100000;

// ===== 会话状态（全部仅存内存，绝不写入 localStorage）=====
let _sessionPwd = null;        // 主密码（仅内存，关闭页面即清）
let _sessionRealPat = null;    // 解密出的真实令牌（用完即清）
let _clearRealPat = null;      // 自动清理定时器句柄

// ===== 加密工具（Web Crypto API，浏览器原生实现）=====
async function pbkdf2DeriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
  );
  return await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: PBKDF2_ITER, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false, ["encrypt", "decrypt"]
  );
}

async function aesGcmEncrypt(key, plaintext) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt(
    { name: "AES-GCM", iv }, key, enc.encode(plaintext)
  );
  return {
    iv: btoa(String.fromCharCode(...iv)),
    ciphertext: btoa(String.fromCharCode(...new Uint8Array(ciphertext)))
  };
}

async function aesGcmDecrypt(key, ivB64, ctB64) {
  const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
  const ct = Uint8Array.from(atob(ctB64), c => c.charCodeAt(0));
  const dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
  return new TextDecoder().decode(dec);
}

// ===== GitHub Contents API 封装 =====
async function ghApi(method, path, token, body) {
  const opts = {
    method,
    headers: {
      "Authorization": "Bearer " + token,
      "Accept": "application/vnd.github.v3+json",
      "Content-Type": "application/json"
    }
  };
  if (body) opts.body = JSON.stringify(body);
  return fetch(API_BASE + path, opts);
}

async function ghGetStore(token) {
  const res = await ghApi("GET", `/repos/${GITHUB_REPO}/contents/${encodeURIComponent(GITHUB_FILE)}`, token);
  if (res.status === 404) return { ok: true, exists: false };
  if (!res.ok) return { ok: false, error: "GitHub API " + res.status };
  const d = await res.json();
  const content = JSON.parse(atob(d.content));
  return { ok: true, exists: true, sha: d.sha, data: content };
}

async function ghPutStore(token, encrypted, sha) {
  const content = btoa(JSON.stringify({
    ...encrypted,
    version: 2,
    updated_at: new Date().toISOString()
  }));
  const body = { message: "sync: update encrypted token store", content };
  if (sha) body.sha = sha;
  const res = await ghApi("PUT", `/repos/${GITHUB_REPO}/contents/${encodeURIComponent(GITHUB_FILE)}`, token, body);
  return { ok: res.ok, status: res.status };
}

// ===== 显示脱敏值 =====
function maskPat(pat) {
  if (!pat) return "（空）";
  if (pat.length <= 8) return "****";
  return pat.slice(0, 6) + "****" + pat.slice(-4);
}

// ===== 启动：根据 MODE 显示对应登录 =====
window.addEventListener("DOMContentLoaded", () => {
  if (MODE === "worker") {
    // Worker Mode：原 admin/admin 登录
    document.getElementById("modeLabel").textContent = "🔵 Worker 模式（密钥存 Cloudflare）";
  } else {
    // GitHub Mode：主密码 + 存储 PAT
    document.getElementById("modeLabel").textContent = "🟢 GitHub 模式（AES 加密多设备同步）";
    // 把"账号"改成"存储 PAT"，"密码"改成"主密码"
    const u = document.getElementById("username");
    const p = document.getElementById("password");
    document.querySelector('label[for="username"]').textContent = "存储 PAT（写仓库权限）";
    document.querySelector('label[for="password"]').textContent = "主密码（每次输入，不保存）";
    u.placeholder = "ghp_... 只有 repo scope 即可";
    p.placeholder = "加密用主密码（请牢记）";
  }
  // 健康检查 + 登录状态检测
  if (MODE === "worker" && localStorage.getItem("github_pat_token")) {
    showMain();
  } else {
    showLogin();
    checkBackendHealth();
  }
});

function showLogin() {
  document.getElementById("loginPage").style.display = "";
  document.getElementById("mainPage").style.display = "none";
}
function showMain() {
  document.getElementById("loginPage").style.display = "none";
  document.getElementById("mainPage").style.display = "";
  document.getElementById("patInput").focus();
  loadCurrentToken();
}

// ===== 登录 =====
async function doLogin() {
  const uEl = document.getElementById("username");
  const pEl = document.getElementById("password");
  const errEl = document.getElementById("loginErr");
  const btn = document.getElementById("loginBtn");
  const u = uEl.value.trim();
  const p = pEl.value;
  errEl.textContent = "";
  if (!u || !p) { errEl.textContent = "请填写完整"; return; }
  btn.disabled = true; btn.textContent = "登录中...";

  if (MODE === "worker") {
    // Worker Mode：POST /api/login
    const res = await fetch(API_BASE + "/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p })
    });
    let data = {};
    try { data = await res.json(); } catch {}
    if (res.ok && data.token) {
      localStorage.setItem("github_pat_token", data.token);
      showMain();
    } else {
      errEl.textContent = data.error || "登录失败";
    }
  } else {
    // GitHub Mode：验证 PAT，主密码仅存内存（localStorage 不存）
    const res = await ghApi("GET", "/user", u);
    if (!res.ok) {
      errEl.textContent = "PAT 无效或权限不足（GitHub API " + res.status + "）";
    } else {
      _sessionPwd = p;                          // 主密码仅存内存
      localStorage.setItem("gh_sync_pat", u);   // 只存"用于读写仓库"的 PAT
      pEl.value = "";                           // 清空密码输入框
      showMain();
    }
  }
  btn.disabled = false; btn.textContent = "登录";
}

// ===== 加载当前令牌 =====
async function loadCurrentToken() {
  const el = document.getElementById("currentToken");
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true;
  if (MODE === "worker") {
    const t = localStorage.getItem("github_pat_token");
    if (!t) { el.textContent = "（未登录）"; btn.disabled = false; return; }
    const res = await fetch(API_BASE + "/api/get-token", {
      headers: { "Authorization": "Bearer " + t }
    });
    let data = {}; try { data = await res.json(); } catch {}
    if (res.status === 401) { localStorage.removeItem("github_pat_token"); showLogin(); return; }
    if (data.hasToken && data.preview) { el.className = "value"; el.textContent = data.preview; }
    else { el.className = "value empty"; el.textContent = "（未设置）"; }
  } else {
    // GitHub Mode：读取加密存储并解密
    const pat = localStorage.getItem("gh_sync_pat");
    if (!pat) { el.textContent = "（未登录）"; btn.disabled = false; return; }
    const g = await ghGetStore(pat);
    if (!g.ok) {
      el.className = "value empty";
      el.textContent = "⚠️ 读取失败：" + g.error;
      btn.disabled = false; return;
    }
    if (!g.exists || !g.data.encrypted) {
      el.className = "value empty";
      el.textContent = "（未设置，请在下方输入新令牌并提交）";
      btn.disabled = false; return;
    }
    // 主密码优先用会话内存，缺失时才询问（不落 localStorage）
    const pwd = _sessionPwd || prompt("请输入主密码（解密用）：");
    if (!pwd) { el.className = "value empty"; el.textContent = "（已取消）"; btn.disabled = false; return; }
    try {
      const salt = Uint8Array.from(atob(g.data.salt), c => c.charCodeAt(0));
      const key = await pbkdf2DeriveKey(pwd, salt);
      const plain = await aesGcmDecrypt(key, g.data.iv, g.data.encrypted);
      _sessionPwd = pwd;                 // 记住本次会话主密码（仅内存）
      el.className = "value";
      el.textContent = maskPat(plain);
      _sessionRealPat = plain;           // 真实令牌短暂在内存
      if (_clearRealPat) clearTimeout(_clearRealPat);
      _clearRealPat = setTimeout(() => { _sessionRealPat = null; }, 30000);  // 30 秒后自动清
    } catch (e) {
      _sessionPwd = null;                // 密码错误则清掉，避免反复用错密码
      el.className = "value empty";
      el.textContent = "⚠️ 主密码错误（无法解密）";
    }
  }
  btn.disabled = false;
}

// ===== 更新令牌（核心功能）=====
async function updatePat() {
  const input = document.getElementById("patInput");
  const btn = document.getElementById("updateBtn");
  const newPat = input.value.trim();
  if (!newPat) { showResult("error", "请输入新令牌"); return; }
  btn.disabled = true; btn.textContent = "提交中...";

  if (MODE === "worker") {
    const t = localStorage.getItem("github_pat_token");
    if (!t) { showLogin(); btn.disabled = false; btn.textContent = "提交更新"; return; }
    const res = await fetch(API_BASE + "/api/update-key", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + t
      },
      body: JSON.stringify({ apiKey: newPat })
    });
    let data = {}; try { data = await res.json(); } catch {}
    if (res.status === 401) { localStorage.removeItem("github_pat_token"); showLogin(); return; }
    if (data.persisted) showResult("success", data.message || "✅ 已持久化");
    else showResult("warn", data.message || "已在内存生效");
    input.value = ""; loadCurrentToken();
  } else {
    // GitHub Mode：AES 加密后写回仓库（多设备同步）
    const pat = localStorage.getItem("gh_sync_pat");
    if (!pat) { showLogin(); btn.disabled = false; btn.textContent = "提交更新"; return; }

    const g = await ghGetStore(pat);
    if (!g.ok) {
      showResult("error", "读取存储失败：" + g.error);
      btn.disabled = false; btn.textContent = "提交更新"; return;
    }
    const sha = (g.exists && g.sha) ? g.sha : null;

    // 取主密码：优先会话内存，缺失时询问（不落 localStorage）
    const pwd = _sessionPwd || prompt("请输入主密码（加密用）：");
    if (!pwd) { btn.disabled = false; btn.textContent = "提交更新"; return; }

    // salt：已有则复用（保证同一密码可跨设备解密），首次则随机生成
    const saltArr = (g.exists && g.data.salt)
      ? Uint8Array.from(atob(g.data.salt), c => c.charCodeAt(0))
      : crypto.getRandomValues(new Uint8Array(16));

    const key = await pbkdf2DeriveKey(pwd, saltArr);
    const enc = await aesGcmEncrypt(key, newPat);
    const write = await ghPutStore(pat, {
      salt: btoa(String.fromCharCode(...saltArr)),
      encrypted: enc.ciphertext,
      iv: enc.iv
    }, sha);

    if (write.ok) {
      _sessionPwd = pwd;   // 成功后记住本次会话密码（仅内存）
      showResult("success", "✅ 已加密保存，其他设备刷新即可同步");
      input.value = "";
      _sessionRealPat = null;              // 用完即清
      if (_clearRealPat) clearTimeout(_clearRealPat);
      loadCurrentToken();
    } else if (write.status === 409) {
      showResult("error", "写入冲突（文件已被其他设备修改），请刷新后重试");
    } else {
      showResult("error", "写入失败（HTTP " + write.status + "）");
    }
  }
  btn.disabled = false; btn.textContent = "提交更新";
}

// ===== 退出登录：清除所有本地状态 =====
function doLogout() {
  if (MODE === "worker") {
    localStorage.removeItem("github_pat_token");
  } else {
    localStorage.removeItem("gh_sync_pat");
  }
  // 无论哪种模式，都清空内存中的敏感状态
  _sessionPwd = null;
  _sessionRealPat = null;
  if (_clearRealPat) { clearTimeout(_clearRealPat); _clearRealPat = null; }
  showLogin();
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("patInput").value = "";
  document.getElementById("result").className = "result";
  document.getElementById("result").textContent = "";
  checkBackendHealth();
}

// ===== 密码框小眼睛 =====
function toggleLoginPwd() {
  const input = document.getElementById("password");
  input.type = input.type === "password" ? "text" : "password";
}

// ===== 后端健康检查（模式适配）=====
async function checkBackendHealth() {
  const urlEl = document.getElementById("workerUrlDisplay");
  const statusEl = document.getElementById("workerStatus");
  if (!urlEl) return;
  if (MODE === "worker") {
    urlEl.textContent = API_BASE || location.origin + "（Worker 后端）";
    statusEl.textContent = "检测中...";
    statusEl.className = "status-wait";
    try {
      const res = await fetch(API_BASE + "/health");
      if (res.ok) { statusEl.textContent = "✅ Worker 已连接"; statusEl.className = "status-ok"; }
      else { statusEl.textContent = "❌ HTTP " + res.status; statusEl.className = "status-bad"; }
    } catch (e) {
      statusEl.textContent = "❌ 无法连接 Worker（workers.dev 可能不稳定）";
      statusEl.className = "status-bad";
    }
  } else {
    // GitHub Mode：测 api.github.com + 多设备同步状态
    urlEl.textContent = "GitHub API（" + GITHUB_REPO + "/" + GITHUB_FILE + "）";
    statusEl.textContent = "检测中...";
    statusEl.className = "status-wait";
    try {
      const res = await fetch(API_BASE + "/rate_limit");
      if (res.ok) {
        // 检查 .sync-data 文件是否存在
        const pat = localStorage.getItem("gh_sync_pat");
        if (pat) {
          const g = await ghGetStore(pat);
          if (g.ok && g.exists) {
            statusEl.textContent = "✅ GitHub API + 多设备同步可用";
          } else {
            statusEl.textContent = "⚠️ 存储文件未初始化（首次使用会自动创建）";
          }
        } else {
          statusEl.textContent = "✅ GitHub API 可达，请登录以启用多设备同步";
        }
        statusEl.className = "status-ok";
      } else { statusEl.textContent = "❌ GitHub API HTTP " + res.status; statusEl.className = "status-bad"; }
    } catch (e) {
      statusEl.textContent = "❌ 无法连接 GitHub API"; statusEl.className = "status-bad";
    }
  }
}

// ===== 结果提示 =====
function showResult(type, text) {
  const el = document.getElementById("result");
  el.className = "result " + type;
  el.textContent = text;
}

// ===== 页面关闭/刷新时清空内存中的敏感数据 =====
window.addEventListener("beforeunload", () => {
  _sessionPwd = null;
  _sessionRealPat = null;
});
</script>
