<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trae AI 代理</title>
<style>
  :root{
    --bg:#0f1115;--card:#1a1d24;--card-2:#22262f;--ink:#e8eaed;
    --muted:#8b9099;--line:#2a2f3a;--accent:#ff5c1f;--accent-deep:#e64a10;
    --ok:#3ddc84;--err:#ef4444;--radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;min-height:100vh;
  }
  .hidden{display:none!important}

  /* 登录页 */
  #login-view{
    flex:1;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .login-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:36px 32px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.4);
  }
  .login-card h1{font-size:22px;margin-bottom:6px;text-align:center}
  .login-card .sub{color:var(--muted);font-size:13px;text-align:center;margin-bottom:28px}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field input{
    width:100%;background:var(--card-2);border:1px solid var(--line);
    color:var(--ink);padding:11px 14px;border-radius:8px;font-size:14px;
    transition:border-color .2s;outline:none;
  }
  .field input:focus{border-color:var(--accent)}
  .btn{
    width:100%;background:var(--accent);color:#fff;border:none;
    padding:12px;border-radius:8px;font-size:15px;font-weight:600;
    cursor:pointer;transition:background .2s;margin-top:6px;
  }
  .btn:hover{background:var(--accent-deep)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
  .msg.err{color:var(--err)}
  .msg.ok{color:var(--ok)}

  /* 对话页 */
  #chat-view{flex:1;display:flex;flex-direction:column;min-height:100vh}
  .chat-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:10;
  }
  .chat-header .title{font-weight:600;font-size:15px}
  .chat-header .logout{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;
  }
  .chat-header .logout:hover{border-color:var(--accent);color:var(--accent)}
  .messages{
    flex:1;overflow-y:auto;padding:20px;max-width:880px;margin:0 auto;width:100%;
  }
  .msg-item{margin-bottom:18px;display:flex;flex-direction:column}
  .msg-item.user{align-items:flex-end}
  .msg-item.ai{align-items:flex-start}
  .msg-bubble{
    max-width:80%;padding:11px 15px;border-radius:12px;font-size:14.5px;
    line-height:1.6;white-space:pre-wrap;word-break:break-word;
  }
  .msg-item.user .msg-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg-item.ai .msg-bubble{background:var(--card-2);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg-role{font-size:11px;color:var(--muted);margin-bottom:4px;padding:0 4px}
  .msg-item.err .msg-bubble{background:rgba(239,68,68,.15);color:var(--err);border:1px solid rgba(239,68,68,.3)}
  .typing{color:var(--muted);font-size:13px;padding:0 4px}
  .typing span{display:inline-block;animation:dot 1.4s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes dot{0%,60%,100%{opacity:.3}30%{opacity:1}}

  .composer{
    border-top:1px solid var(--line);background:var(--card);padding:14px 20px;
    position:sticky;bottom:0;
  }
  .composer-inner{max-width:880px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  .composer textarea{
    flex:1;background:var(--card-2);border:1px solid var(--line);color:var(--ink);
    padding:11px 14px;border-radius:10px;font-size:14.5px;resize:none;outline:none;
    min-height:44px;max-height:160px;line-height:1.5;font-family:inherit;
    transition:border-color .2s;
  }
  .composer textarea:focus{border-color:var(--accent)}
  .composer button{
    background:var(--accent);color:#fff;border:none;padding:0 18px;
    border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
    height:44px;transition:background .2s;
  }
  .composer button:hover:not(:disabled){background:var(--accent-deep)}
  .composer button:disabled{opacity:.5;cursor:not-allowed}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
</style>
</head>
<body>

<!-- 登录页 -->
<section id="login-view">
  <div class="login-card">
    <h1>Trae AI 代理</h1>
    <p class="sub">单人自用 · 密钥安全托管</p>
    <div class="field">
      <label>账号</label>
      <input id="username" type="text" autocomplete="username" placeholder="输入账号">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="输入密码">
    </div>
    <button class="btn" id="login-btn" type="button">登录</button>
    <div class="msg" id="login-msg"></div>
  </div>
</section>

<!-- 对话页 -->
<section id="chat-view" class="hidden">
  <header class="chat-header">
    <div class="title">Trae AI 代理</div>
    <button class="logout" id="logout-btn" type="button">退出登录</button>
  </header>
  <div class="messages" id="messages">
    <div class="msg-item ai">
      <div class="msg-role">AI</div>
      <div class="msg-bubble">你好，我是 Trae AI 代理。输入你的问题，我会通过安全网关转发到 Trae API 并返回回答。</div>
    </div>
  </div>
  <div class="composer">
    <div class="composer-inner">
      <textarea id="prompt-input" placeholder="输入问题，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
      <button id="send-btn" type="button">发送</button>
    </div>
    <div class="hint">密钥保存在 Cloudflare Workers 后台，前端不接触原始密钥</div>
  </div>
</section>

<script>
"use strict";
// ⚠️ 部署前必改：改成你自己的 Cloudflare Worker 域名
const WORKER_URL = "https://trae-proxy.YOUR_SUBDOMAIN.workers.dev";

const $ = id => document.getElementById(id);
let token = "";            // 登录后获得的临时 token，仅保存在内存
let isSending = false;

/* ---------- 登录 ---------- */
$("login-btn").addEventListener("click", doLogin);
$("password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

async function doLogin() {
  const u = $("username").value.trim();
  const p = $("password").value;
  const msg = $("login-msg");
  msg.className = "msg"; msg.textContent = "";
  if (!u || !p) { msg.className = "msg err"; msg.textContent = "请填写账号和密码"; return; }

  $("login-btn").disabled = true;
  try {
    const res = await fetch(WORKER_URL + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (!res.ok || !data.token) {
      throw new Error(data.error || "登录失败");
    }
    token = data.token;
    $("login-view").classList.add("hidden");
    $("chat-view").classList.remove("hidden");
    $("prompt-input").focus();
  } catch (e) {
    msg.className = "msg err";
    msg.textContent = e.message === "Failed to fetch"
      ? "无法连接后端，请检查 Worker 地址或网络"
      : e.message;
  } finally {
    $("login-btn").disabled = false;
  }
}

/* ---------- 退出 ---------- */
$("logout-btn").addEventListener("click", () => {
  token = "";
  $("chat-view").classList.add("hidden");
  $("login-view").classList.remove("hidden");
  $("username").value = "";
  $("password").value = "";
  $("messages").innerHTML = `
    <div class="msg-item ai">
      <div class="msg-role">AI</div>
      <div class="msg-bubble">你好，我是 Trae AI 代理。输入你的问题，我会通过安全网关转发到 Trae API 并返回回答。</div>
    </div>`;
});

/* ---------- 发送对话 ---------- */
const ta = $("prompt-input");
ta.addEventListener("input", () => {
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, 160) + "px";
});
ta.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendPrompt(); }
});
$("send-btn").addEventListener("click", sendPrompt);

async function sendPrompt() {
  if (isSending) return;
  const prompt = ta.value.trim();
  if (!prompt) return;

  addMessage("user", prompt);
  ta.value = ""; ta.style.height = "auto";
  const typingEl = addTyping();

  isSending = true;
  $("send-btn").disabled = true;
  try {
    const res = await fetch(WORKER_URL + "/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ prompt })
    });
    const data = await res.json();
    typingEl.remove();
    if (!res.ok) {
      const errMsg = data.error || ("请求失败 HTTP " + res.status);
      addMessage("ai", errMsg, true);
      if (res.status === 401) {
        // token 失效，返回登录页
        setTimeout(() => $("logout-btn").click(), 1200);
      }
    } else {
      addMessage("ai", data.reply || "(空回复)");
    }
  } catch (e) {
    typingEl.remove();
    addMessage("ai", "网络错误：" + e.message, true);
  } finally {
    isSending = false;
    $("send-btn").disabled = false;
    ta.focus();
  }
}

function addMessage(role, text, isErr) {
  const wrap = document.createElement("div");
  wrap.className = "msg-item " + role + (isErr ? " err" : "");
  wrap.innerHTML = `<div class="msg-role">${role === "user" ? "你" : "AI"}</div>
    <div class="msg-bubble"></div>`;
  wrap.querySelector(".msg-bubble").textContent = text;
  $("messages").appendChild(wrap);
  $("messages").scrollTop = $("messages").scrollHeight;
  return wrap;
}

function addTyping() {
  const wrap = document.createElement("div");
  wrap.className = "msg-item ai";
  wrap.innerHTML = `<div class="msg-role">AI</div><div class="typing"><span>•</span><span>•</span><span>•</span></div>`;
  $("messages").appendChild(wrap);
  $("messages").scrollTop = $("messages").scrollHeight;
  return wrap;
}
</script>
</body>
</html>
