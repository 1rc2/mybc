<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trae AI 助手</title>
<style>
  /* ===== 全局重置 + 深色主题 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  /* ===== 登录页 ===== */
  .login-wrap {
    width: 360px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 32px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .login-wrap h1 {
    font-size: 20px;
    margin-bottom: 6px;
    color: #4e9acd;
  }
  .login-wrap .sub {
    font-size: 13px;
    color: #8b949e;
    margin-bottom: 24px;
  }
  .login-wrap label {
    display: block;
    font-size: 13px;
    color: #8b949e;
    margin: 10px 0 6px;
  }
  .login-wrap input {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .login-wrap input:focus { border-color: #4e9acd; }
  .login-wrap button {
    width: 100%;
    height: 40px;
    margin-top: 18px;
    background: #4e9acd;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background .15s;
  }
  .login-wrap button:hover { background: #3d8ab9; }
  .login-wrap button:disabled { background: #3a3f4a; cursor: not-allowed; }
  .err-msg {
    color: #f97583;
    font-size: 13px;
    margin-top: 10px;
    min-height: 18px;
  }

  /* ===== 对话页 ===== */
  .chat-wrap {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #0d1117;
  }
  .chat-header {
    height: 56px;
    padding: 0 20px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .chat-header .title {
    font-size: 16px;
    color: #4e9acd;
  }
  .chat-header button {
    height: 32px;
    padding: 0 14px;
    background: transparent;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    font-size: 13px;
    cursor: pointer;
  }
  .chat-header button:hover { border-color: #4e9acd; color: #4e9acd; }

  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    max-width: 960px;
    margin: 0 auto;
    width: 100%;
  }
  .msg {
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
  }
  .msg .role {
    font-size: 12px;
    color: #8b949e;
    margin-bottom: 6px;
  }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble {
    background: #4e9acd;
    color: #fff;
  }
  .msg.ai .bubble {
    background: #161b22;
    border: 1px solid #30363d;
  }
  .bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .chat-input {
    border-top: 1px solid #30363d;
    background: #161b22;
    padding: 14px 20px;
    max-width: 960px;
    margin: 0 auto;
    width: 100%;
    flex-shrink: 0;
  }
  .chat-input .row {
    display: flex;
    gap: 10px;
  }
  .chat-input textarea {
    flex: 1;
    height: 56px;
    padding: 12px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 14px;
    resize: none;
    outline: none;
    font-family: inherit;
  }
  .chat-input textarea:focus { border-color: #4e9acd; }
  .chat-input button {
    width: 90px;
    background: #4e9acd;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .chat-input button:hover { background: #3d8ab9; }
  .chat-input button:disabled { background: #3a3f4a; cursor: not-allowed; }

  /* 滚动条样式 */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0d1117; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #4e9acd; }
</style>
</head>
<body>

<!-- ===== 登录页 ===== -->
<div class="login-wrap" id="loginPage">
  <h1>Trae AI 助手</h1>
  <p class="sub">登录后开始对话</p>
  <label for="username">账号</label>
  <input id="username" type="text" autocomplete="username" placeholder="请输入账号">
  <label for="password">密码</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
  <button id="loginBtn" onclick="doLogin()">登录</button>
  <div class="err-msg" id="loginErr"></div>
</div>

<!-- ===== 对话页 ===== -->
<div class="chat-wrap" id="chatPage" style="display:none">
  <div class="chat-header">
    <div class="title">Trae AI 助手</div>
    <button onclick="doLogout()">退出登录</button>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-input">
    <div class="row">
      <textarea id="promptInput" placeholder="输入你的问题，Ctrl+Enter 发送..." onkeydown="handleKey(event)"></textarea>
      <button id="sendBtn" onclick="sendPrompt()">发送</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
 * 前端逻辑说明
 * ------------------------------------------------------------
 * 1) 前端只保存临时登录 token（localStorage），不保存任何 API 密钥
 * 2) 每次发送 prompt 时，附带 Authorization: Bearer <token>
 * 3) Worker 在后台用 TRAE_API_KEY 转发请求，密钥不会返回前端
 * ============================================================ */

// ===== 配置：Cloudflare Worker 部署地址 =====
// 部署 Worker 后，把 WORKER_URL 替换为你的 Worker 实际域名
// 例如：https://trae-proxy.你的子域.workers.dev
const WORKER_URL = "https://trae-proxy.你的子域.workers.dev";

// token 只在浏览器保存临时登录凭证（不是 API 密钥）
function getToken() { return localStorage.getItem("trae_token") || ""; }
function setToken(t) { localStorage.setItem("trae_token", t); }
function clearToken() { localStorage.removeItem("trae_token"); }

// 启动时若有 token 直接进入对话页
if (getToken()) { showChat(); } else { showLogin(); }

function showLogin() {
  document.getElementById("loginPage").style.display = "";
  document.getElementById("chatPage").style.display = "none";
}
function showChat() {
  document.getElementById("loginPage").style.display = "none";
  document.getElementById("chatPage").style.display = "";
  document.getElementById("chatBody").innerHTML = "";
  appendMsg("ai", "你好，我是 Trae AI 助手，请问有什么可以帮你？");
  document.getElementById("promptInput").focus();
}

// ===== 登录 =====
async function doLogin() {
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value;
  const errEl = document.getElementById("loginErr");
  const btn = document.getElementById("loginBtn");
  errEl.textContent = "";
  if (!u || !p) { errEl.textContent = "请输入账号和密码"; return; }
  btn.disabled = true; btn.textContent = "登录中...";
  try {
    const res = await fetch(`${WORKER_URL}/api/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (res.ok && data.token) {
      setToken(data.token);
      showChat();
    } else {
      errEl.textContent = data.error || "登录失败";
    }
  } catch (e) {
    errEl.textContent = "网络错误：" + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "登录";
  }
}

// ===== 退出登录 =====
function doLogout() {
  clearToken();
  showLogin();
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
}

// ===== 发送 prompt 给 Worker =====
async function sendPrompt() {
  const ta = document.getElementById("promptInput");
  const btn = document.getElementById("sendBtn");
  const text = ta.value.trim();
  if (!text) return;
  if (!getToken()) { doLogout(); return; }

  appendMsg("user", text);  // 先把自己的话显示出来
  ta.value = "";
  btn.disabled = true; btn.textContent = "请求中...";

  // 占位一条 AI 消息，等返回后填充
  const aiEl = appendMsg("ai", "正在思考...");

  try {
    const res = await fetch(`${WORKER_URL}/api/ai`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + getToken()  // 只传临时 token，不传 API 密钥
      },
      body: JSON.stringify({ prompt: text })
    });
    const data = await res.json();
    if (res.ok) {
      aiEl.querySelector(".bubble").textContent = data.reply || "(空回复)";
    } else if (res.status === 401) {
      clearToken();
      aiEl.querySelector(".bubble").textContent = "登录已失效：" + (data.error || "请重新登录");
      setTimeout(showLogin, 1500);
    } else {
      aiEl.querySelector(".bubble").textContent = "出错：" + (data.error || "未知错误");
    }
  } catch (e) {
    aiEl.querySelector(".bubble").textContent = "网络错误：" + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "发送";
    ta.focus();
  }
}

// ===== 在对话区追加一条消息，返回该消息元素 =====
function appendMsg(role, text) {
  const body = document.getElementById("chatBody");
  const div = document.createElement("div");
  div.className = "msg " + role;
  const roleEl = document.createElement("div");
  roleEl.className = "role";
  roleEl.textContent = role === "user" ? "我" : "AI";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  div.appendChild(roleEl);
  div.appendChild(bubble);
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}

// ===== Ctrl+Enter / Cmd+Enter 发送 =====
function handleKey(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    sendPrompt();
  }
}
</script>
</body>
</html>
